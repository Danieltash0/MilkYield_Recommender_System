services:
  db:
    image: mysql:8
    container_name: dairydan-db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-rootpass}
      MYSQL_DATABASE: ${DB_NAME:-dairydan_db}
    # Published on host port 3307 so it never clashes with a locally installed
    # MySQL on 3306. Override with DB_PORT in a root .env; keep server/.env in sync.
    ports:
      - "${DB_PORT:-3307}:3306"
    volumes:
      - dairydan-db-data:/var/lib/mysql
      - ./db/schema.sql:/docker-entrypoint-initdb.d/1-schema.sql
      - ./db/seed.sql:/docker-entrypoint-initdb.d/2-seed.sql

volumes:
  dairydan-db-data:
